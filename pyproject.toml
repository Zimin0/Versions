[build-system]
requires = [
    "setuptools>=77.0.3",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"


[project]
name = "versions"
dynamic = ["version"]
description = "Extensible version formats, validation, detection, and conversion."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "pydantic>=2,<3",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6",
    "build>=1.2",
    "black>=25",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4",
]

[project.urls]
Repository = "https://github.com/Zimin0/Versions"
Issues = "https://github.com/Zimin0/Versions/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["versions*"]
exclude = [
    "tests*",
    "example_of_usage*",
]
namespaces = false


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # import sorting
    "B",  # flake8-bugbear
]
